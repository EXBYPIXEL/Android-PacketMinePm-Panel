<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<meta name="color-scheme" content="dark">
<title>PM Panel</title>
<link rel="stylesheet" href="style.css">
<script>
/* Very old, never-updated WebViews (stock Android 5.x) cannot parse ES6.
   Show a readable message instead of a white screen. */
(function () {
  try { new Function('async () => 1')(); }
  catch (e) {
    document.documentElement.innerHTML =
      '<body style="margin:0;background:#05060A;color:#fff;font-family:sans-serif;' +
      'display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;padding:24px">' +
      '<div>' +
      '<p style="font-size:18px;line-height:1.8">This app needs an updated WebView.<br>' +
      'Please update <b>Android System WebView</b> (and Google Chrome) in Google Play, then reopen the app.</p>' +
      '<p dir="rtl" style="font-size:16px;line-height:1.9">این برنامه به WebView به‌روز نیاز دارد.<br>' +
      'لطفاً <b>Android System WebView</b> و Chrome را در Google Play به‌روز کنید و برنامه را دوباره باز کنید.</p>' +
      '</div></body>';
    throw e;
  }
})();
</script>
</head>
<body>
<div id="appShell">
  <header id="topbar">
    <div class="brand">
      <span class="brand-icon" id="brandIcon"></span>
      <span class="brand-title">PM Panel</span>
    </div>
    <div class="top-actions">
      <div id="statePill" class="pill bare state-idle"><span id="statePillName" class="pill-name"></span><span id="statePillText">—</span></div>
      <button id="topSettingsBtn" class="topbar-btn" aria-label="تنظیمات"><span class="tb-ic"></span></button>
    </div>
  </header>

  <main id="view"></main>

  <nav id="bottomnav">
    <span id="navIndicator" class="nav-indicator"></span>
    <button class="nav-btn" data-view="home" data-aria="nav_home" aria-label="داشبورد"><span class="nav-ic" data-ic="home"></span></button>
    <button class="nav-btn" data-view="console" data-aria="nav_console" aria-label="کنسول"><span class="nav-ic" data-ic="terminal"></span></button>
    <button class="nav-btn" data-view="files" data-aria="nav_files" aria-label="فایل‌ها"><span class="nav-ic" data-ic="folder"></span></button>
    <button class="nav-btn" data-view="content" data-aria="nav_content" aria-label="محتوا"><span class="nav-ic" data-ic="puzzle"></span></button>
    <button class="nav-btn" data-view="tools" data-aria="nav_tools" aria-label="ابزارها"><span class="nav-ic" data-ic="grid"></span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="terminalOverlay" class="hidden">
  <div class="term-topbar">
    <button id="termBackBtn" class="icon-btn plain"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span class="term-title">PocketMine Terminal</span>
    <span id="termState" class="pill state-idle"><span class="dot"></span><span id="termStateText">—</span></span>
  </div>
  <div id="termScreen" class="term-screen"></div>
  <div class="term-inputrow">
    <span class="term-prompt">❯</span>
    <input id="termInput" type="text" autocomplete="off" spellcheck="false" placeholder="help">
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/views-core.js"></script>
<script src="js/views-files.js"></script>
<script src="js/views-tools.js"></script>
<script src="js/views-stats.js"></script>
<script src="js/views-market.js"></script>
<script src="js/views-v2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
